services:
  postgres:
    image: postgres:16-alpine
    container_name: daleh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daleh
    ports:
      - "5432:5432"
    volumes:
      - daleh_pg_data:/var/lib/postgresql/data

volumes:
  daleh_pg_data:
